<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KB Fitness App PWA</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <!-- MediaPipe Pose Detection -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <!-- Modular Scripts -->
  <script src="src/config.js"></script>
  <script src="src/data/schedule.js"></script>
  <script src="src/services/driveSync.js"></script>
  <script src="src/services/poseTracker.js"></script>
  <script src="src/services/geminiCoach.js"></script>
  <script src="src/app.js"></script>
</head>
<body class="p-4 max-w-md mx-auto bg-slate-900 text-slate-100 font-sans" x-data="fitnessApp()" x-init="initApp()">

  <!-- App Header -->
  <header class="flex justify-between items-center mb-6 pt-2">
    <div>
      <h1 class="text-2xl font-bold text-emerald-400">KB Fit Companion</h1>
      <p class="text-xs text-slate-400">4-Day Kettlebell Program</p>
    </div>
    <div class="flex space-x-2">
      <button @click="syncData()" class="p-2 bg-slate-800 rounded-xl border border-slate-700 text-xs text-emerald-400 font-medium flex items-center gap-1">
        <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
        <span x-text="syncStatus">Sync</span>
      </button>
    </div>
  </header>

  <!-- Camera Modal / Viewfinder for Tracking -->
  <div x-show="cameraActive" class="mb-6 bg-slate-950 p-3 rounded-2xl border border-emerald-500/40 relative overflow-hidden">
    <div class="flex justify-between items-center mb-2">
      <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider">AI Vision Tracker</span>
      <button @click="stopCamera()" class="text-xs bg-red-500/20 text-red-400 px-2 py-0.5 rounded font-bold">Close Camera</button>
    </div>
    
    <div class="relative w-full h-60 bg-black rounded-xl overflow-hidden flex items-center justify-center">
      <video id="webcam" class="absolute inset-0 w-full h-full object-cover" autoplay playsinline></video>
      <canvas id="poseCanvas" class="absolute inset-0 w-full h-full"></canvas>
      
      <!-- Real-time HUD -->
      <div class="absolute top-2 left-2 bg-slate-900/80 px-3 py-1 rounded-lg border border-slate-700">
        <p class="text-[10px] text-slate-400 uppercase">Reps</p>
        <p class="text-2xl font-black text-emerald-400" x-text="repCount">0</p>
      </div>

      <div class="absolute bottom-2 left-2 right-2 bg-slate-900/90 p-2 rounded-lg border border-slate-700 text-center">
        <p class="text-xs font-medium text-amber-300" x-text="feedbackMsg || 'Position yourself in frame'"></p>
      </div>
    </div>
  </div>

  <!-- Day Selector -->
  <div class="flex space-x-2 mb-6 overflow-x-auto pb-2">
    <template x-for="(day, index) in schedule" :key="day.id">
      <button 
        @click="activeDay = index"
        :class="activeDay === index ? 'bg-emerald-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-400'"
        class="px-4 py-2 rounded-xl text-sm whitespace-nowrap transition-all">
        <span x-text="'Day ' + (index + 1)"></span>
      </button>
    </template>
  </div>

  <!-- Main Exercises -->
  <div class="space-y-4">
    <template x-for="(ex, exIdx) in schedule[activeDay].mainWorkout" :key="ex.name">
      <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700 space-y-3">
        <div class="flex justify-between items-start">
          <div>
            <h4 class="font-bold text-slate-100 text-base" x-text="ex.name"></h4>
            <p class="text-xs text-slate-400" x-text="ex.target"></p>
          </div>
          <button @click="startCamera(ex.type)" class="bg-emerald-950 border border-emerald-500/30 text-emerald-300 text-xs px-2.5 py-1 rounded-lg font-bold flex items-center gap-1">
            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path fill-rule="evenodd" d="M1.323 11.447C2.811 6.976 7.028 3.75 12 3.75c4.969 0 9.187 3.226 10.677 7.697a1.75 1.75 0 010 1.106C21.187 17.024 16.969 20.25 12 20.25c-4.97 0-9.189-3.226-10.677-7.697a1.75 1.75 0 010-1.106zM12 16.5a4.5 4.5 0 100-9 4.5 4.5 0 000 9z" clip-rule="evenodd"/></svg>
            Track Form
          </button>
        </div>

        <!-- Set Controls -->
        <div class="flex items-center justify-between pt-2">
          <span class="text-xs text-slate-400">Log Sets:</span>
          <div class="flex space-x-2">
            <template x-for="setNum in ex.sets" :key="setNum">
              <button 
                @click="toggleSet(activeDay, exIdx, setNum)"
                :class="isSetComplete(activeDay, exIdx, setNum) ? 'bg-emerald-500 text-slate-950 font-bold' : 'bg-slate-700 text-slate-300'"
                class="w-8 h-8 rounded-lg text-xs">
                <span x-text="setNum"></span>
              </button>
            </template>
          </div>
        </div>
      </div>
    </template>
  </div>

</body>
</html>
